<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GLB Viewer with Shadows</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: #777;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background-color: #777;
      background-image: url('https://pasros.github.io/PR/ssg1.png');
      background-repeat: no-repeat;
      background-position: center left;
      background-size: contain;
      z-index: 0;
    }

    model-viewer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      --poster-color: transparent;
      --progress-bar-color: transparent;
    }

    .title-bottom-right {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: black;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.6);
      padding: 6px 12px;
      border-radius: 10px;
      z-index: 10;
      user-select: none;
      backdrop-filter: blur(4px);
    }

    @media (max-width: 768px) {
      .title-bottom-right {
        font-size: 12px;
        bottom: 10px;
        right: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="background"></div>

  <model-viewer
    id="viewer"
    src="https://raw.githubusercontent.com/pasros/PR/main/R12.glb"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    shadow-softness="0.5"
    exposure=".8"
    environment-image="https://modelviewer.dev/shared-assets/environments/neutral.hdr"
    tone-mapping="neutral"
  >
    <div class="title-bottom-right">signet ring with 22 mm in diameter with 2 mm band</div>
  </model-viewer>
</body>
</html>
